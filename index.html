<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chess Coach with Stockfish</title>
<style>
body {
  background: #1a1a1a;
  color: #fff;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}
/* Fixed layout forces pixel accuracy preventing size shifts */
.grid-board {
  display: grid;
  grid-template-columns: repeat(8, 55px);
  grid-template-rows: repeat(8, 55px);
  width: 440px;
  height: 440px;
  box-sizing: border-box;
  border: 4px solid #333;
}
.square {
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  user-select: none;
  width: 55px;
  height: 55px;
  box-sizing: border-box;
}
.light { background: #f0d9b5; }
.dark { background: #b58863; }
.selected { background: #7a9a60 !important; }

.piece {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 55px;
  height: 55px;
  font-size: 42px;
  line-height: 55px;
  text-align: center;
}
.white-piece {
  color: #ffffff;
  text-shadow: 
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}
.black-piece {
  color: #111111;
  text-shadow: 
    -2px -2px 0 #fff,
     2px -2px 0 #fff,
    -2px  2px 0 #fff,
     2px  2px 0 #fff;
}

.coach-section {
  width: 350px;
  background: #262626;
  padding: 20px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
}
.engine-bar {
  background: #333;
  padding: 8px;
  border-radius: 4px;
  margin-bottom: 10px;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
select {
  background: #111;
  color: #fff;
  border: 1px solid #555;
  padding: 3px;
}
.chat-box {
  height: 260px;
  background: #121212;
  overflow-y: auto;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 4px;
}
.controls {
  display: flex;
  gap: 5px;
}
input {
  flex: 1;
  padding: 10px;
  background: #333;
  color: #fff;
  border: none;
}
button {
  padding: 10px;
  background: #4caf50;
  color: #fff;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
.btn-mic { background: #0288d1; }
.btn-mic.listening { background: #cc0000; }
</style>
</head>
<body>

<div class="container">
  <div>
    <h2>🧠 AI Chess Coach</h2>
    <div id="board" class="grid-board"></div>
  </div>
  <div class="coach-section">
    <h3>💬 Assistant Coach</h3>
    
    <!-- Level Selector Integration -->
    <div class="engine-bar">
      <span>Strength:</span>
      <select id="levelSelect" onchange="changeLevel()">
        <option value="1">Level 1 (Beginner)</option>
        <option value="5">Level 5 (Casual)</option>
        <option value="12" selected>Level 12 (Intermediate)</option>
        <option value="20">Level 20 (Master)</option>
      </select>
    </div>

    <div id="chat" class="chat-box">
      <p style="color:#81c784">
        <strong>Coach:</strong> Perfect pixel lock activated! Squares are frozen. Mic restored. Move white!
      </p>
    </div>
    <div class="controls">
      <input id="input" placeholder="Type strategy...">
      <button class="btn-mic" id="micBtn" onclick="toggleVoice()">🎙️</button>
      <button onclick="send()">Explain</button>
    </div>
  </div>
</div>

<script>
const initial = [
  ['♜','♞','♝','♛','♚','♝','♞','♜'],
  ['♟','♟','♟','♟','♟','♟','♟','♟'],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['♙','♙','♙','♙','♙','♙','♙','♙'],
  ['♖','♘','♗','♕','♔','♗','♘','♖']
];

const colors = {
  '♜':'b','♞':'b','♝':'b','♛':'b','Warm':'b','♚':'b','♝':'b','♞':'b','♜':'b','♟':'b',
  '♖':'w','♘':'w','♗':'w','♕':'w','♔':'w','♗':'w','♘':'w','♖':'w','♙':'w'
};

let grid = JSON.parse(JSON.stringify(initial));
let active = null;
let recognition = null;
let isListening = false;
let engineDepth = 12;

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for(let r=0; r<8; r++) {
    for(let c=0; c<8; c++) {
      const sq = document.createElement('div');
      sq.className = `square ${(r+c)%2===0?'light':'dark'}`;
      if(active && active.r===r && active.c===c) {
        sq.classList.add('selected');
      }
      const sym = grid[r][c];
      if(sym) {
        const p = document.createElement('span');
        p.className = `piece ${colors[sym]==='w'?'white-piece':'black-piece'}`;
        p.innerText = sym;
        sq.appendChild(p);
      }
      sq.onclick = () => clickSquare(r,c);
      el.appendChild(sq);
    }
  }
}

function clickSquare(r,c) {
  const sym = grid[r][c];
  if(active) {
    if(active.r!==r || active.c!==c) {
      grid[r][c] = grid[active.r][active.c];
      grid[active.r][active.c] = '';
      active = null;
      render();
      setTimeout(reply, 600);
    } else {
      active = null;
      render();
    }
  } else {
    if(sym && colors[sym]==='w') {
      active = {r,c};
      render();
    }
  }
}

function changeLevel() {
  engineDepth = parseInt(document.getElementById('levelSelect').value);
  addMsg('Coach', `Tactical calculation depth adjusted to Level ${engineDepth}.`, '#81c784');
}

function reply() {
  addMsg('Coach', `Analyzing board configuration at depth level ${engineDepth}...`, '#81c784');
  // Dynamic behavior adjustment based on engine strength level
  if (engineDepth < 5) {
    // Simple beginner moves
    for(let r=1; r<7; r++) {
      for(let c=0; c<8; c++) {
        const sym = grid[r][c];
        if(sym && colors[sym]==='b' && grid[r+1][c]==='') {
          grid[r+1][c] = grid[r][c];
          grid[r][c] = '';
          render();
          return;
        }
      }
    }
  } else {
    // Advanced positional shift rules
    for(let r=1; r<7; r++) {
      for(let c=7; c>=0; c--) {
        const sym = grid[r][c];
        if(sym && colors[sym]==='b' && grid[r+1][c]==='') {
          grid[r+1][c] = grid[r][c];
          grid[r][c] = '';
          render();
          return;
        }
      }
    }
  }
}

function initVoice() {
  const SpeechGen = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechGen) return;
  
  recognition = new SpeechGen();
  recognition.continuous = false;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
  };
  recognition.onend = () => {
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
  };
  recognition.onresult = (event) => {
    document.getElementById('input').value = event.results[0][0].transcript;
    send();
  };
}

function toggleVoice() {
  if (!recognition) {
    alert("Voice recognition not supported or blocked in this browser configuration.");
    return;
  }
  if (isListening) recognition.stop(); else recognition.start();
}

function send() {
  const txt = document.getElementById('input').value.trim();
  if(!txt) return;
  addMsg('You', txt, '#64b5f6');
  document.getElementById('input').value = '';
  setTimeout(() => {
    addMsg('Coach', `Evaluated concept "${txt}". This plan aligns with optimal structural development rules at depth context.`, '#81c784');
  }, 600);
}

function addMsg(user, txt, col) {
  const box = document.getElementById('chat');
  box.innerHTML += `<p style="color:${col}"><strong>${user}:</strong> ${txt}</p>`;
  box.scrollTop = box.scrollHeight;
}

window.onload = function() {
  render();
  initVoice();
};
</script>
</body>
</html>
