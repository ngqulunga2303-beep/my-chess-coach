<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Coach Training Room</title>
    <!-- Combined styles for a native, reliable layout -->
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
        }
        .board-section {
            flex: 1.2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Pure CSS Chessboard structure to bypass external file errors */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1;
            border: 6px solid #333;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2em;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }
        .square.light { background-color: #f0d9b5; }
        .square.dark { background-color: #b58863; }
        .square.selected { background-color: #7a9a60 !important; }
        
        .coach-section {
            flex: 1;
            min-width: 320px;
            background-color: #262626;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .engine-status {
            background-color: #333;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            margin-bottom: 15px;
            color: #a0a0a0;
            display: flex;
            justify-content: space-between;
        }
        .chat-box {
            flex: 1;
            min-height: 280px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 15px;
            background-color: #121212;
            margin-bottom: 15px;
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.coach { color: #81c784; }
        .msg.player { color: #64b5f6; }
        
        .controls {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            font-size: 1em;
        }
        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-send { background-color: #4caf50; color: white; }
        .btn-mic { background-color: #0288d1; color: white; }
        .btn-mic.listening { background-color: #d32f2f; }
    </style>
</head>
<body>

<div class="container">
    <div class="board-section">
        <h2>🧠 AI Coach Training Room</h2>
        <!-- Native grid board -->
        <div id="htmlBoard" class="grid-board"></div>
        <p style="color: #aaa; margin-top: 10px; font-size: 0.9em;">Click a piece, then click a target square to move.</p>
    </div>

    <div class="coach-section">
        <h3>💬 Assistant Coach & Evaluation</h3>
        <div class="engine-status">
            <span>Coach Mind: <strong>Active</strong></span>
            <span id="posEval">Eval: +0.15</span>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="msg coach"><strong>Coach:</strong> Interface connected natively! Click a white pawn or piece to start, or type your strategy concept below.</div>
        </div>
        <div class="controls">
            <input type="text" id="playerInput" placeholder="Type your idea or click Mic...">
            <button class="btn-mic" id="micBtn" onclick="toggleVoice()">🎙️</button>
            <button class="btn-send" onclick="sendPlayerIdea()">Explain</button>
        </div>
    </div>
</div>

<script>
    // Built-in simplified chess simulator engine map
    const initialBoard = [
        ['♜','♞','♝','♛','♚','♝','♞','♜'],
        ['♟','♟','♟','♟','♟','♟','♟','♟'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['♙','♙','♙','♙','♙','♙','♙','♙'],
        ['♖','♘','♗','♕','♔','♗','♘','♖']
    ];

    let currentBoard = JSON.parse(JSON.stringify(initialBoard));
    let selectedSquare = null;
    let recognition = null;
    let isListening = false;

    // Build the board programmatically using standard grid elements and unicode chess assets
    function renderNativeBoard() {
        const boardEl = document.getElementById('htmlBoard');
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }
                
                square.innerText = currentBoard[r][c];
                square.onclick = () => handleSquareClick(r, c);
                boardEl.appendChild(square);
            }
        }
    }

    function handleSquareClick(r, c) {
        const piece = currentBoard[r][c];
        
        if (selectedSquare) {
            // Move piece to the new target
            if (selectedSquare.r !== r || selectedSquare.c !== c) {
                currentBoard[r][c] = currentBoard[selectedSquare.r][selectedSquare.c];
                currentBoard[selectedSquare.r][selectedSquare.c] = '';
                selectedSquare = null;
                renderNativeBoard();
                
                // Trigger AI Feedback response
                setTimeout(() => {
                    appendChat('coach', "Good move! That development strengthens your position. Let's see how the black pieces react.");
                    simulateBlackResponse();
                }, 600);
            } else {
                selectedSquare = null;
                renderNativeBoard();
            }
        } else {
            // Select piece if it's not empty
            if (piece !== '') {
                selectedSquare = { r, c };
                renderNativeBoard();
            }
        }
    }

    function simulateBlackResponse() {
        // Find a black piece and move it randomly down for active layout gameplay
        for (let r = 1; r < 7; r++) {
            for (let c = 0; c < 8; c++) {
                if (['♜','♞','♝','♛','♚','♟'].includes(currentBoard[r][c])) {
                    if (currentBoard[r+1] && currentBoard[r+1][c] === '') {
                        currentBoard[r+1][c] = currentBoard[r][c];
                        currentBoard[r][c] = '';
                        renderNativeBoard();
                        return;
                    }
                }
            }
        }
    }

    // Voice recognition activation logic
    function initVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            document.getElementById('micBtn').style.display = 'none';
            return;
        }
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
        };
        recognition.onend = () => {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
        };
        recognition.onresult = (event) => {
            document.getElementById('playerInput').value = event.results[0][0].transcript;
            sendPlayerIdea();
        };
    }

    function toggleVoice() {
        if (!recognition) return;
        if (isListening) recognition.stop(); else recognition.start();
    }

    function sendPlayerIdea() {
        const inputEl = document.getElementById('playerInput');
        const ideaText = inputEl.value.trim();
        if (!ideaText) return;

        appendChat('player', ideaText);
        inputEl.value = '';

        setTimeout(() => {
            appendChat('coach', `Analyzing strategic intent: "${ideaText}". Your plan is structurally logical. Controlling these central operational lanes will make your endgame much easier.`);
        }, 800);
    }

    function appendChat(sender, text) {
        const box = document.getElementById('chatBox');
        const label = sender === 'coach' ? 'Coach' : 'You';
        box.innerHTML += `<div class="msg ${sender}"><strong>${label}:</strong> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    window.onload = function() {
        renderNativeBoard();
        initVoice();
    };
</script>
</body>
</html>
