<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Coach Training Room</title>
    <!-- Stable styles and dependencies -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
        }
        .board-section {
            flex: 1.2;
            min-width: 320px;
        }
        .coach-section {
            flex: 1;
            min-width: 320px;
            background-color: #262626;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .engine-status {
            background-color: #333;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            margin-bottom: 15px;
            color: #a0a0a0;
            display: flex;
            justify-content: space-between;
        }
        .chat-box {
            flex: 1;
            min-height: 300px;
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 15px;
            background-color: #121212;
            margin-bottom: 15px;
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.coach { color: #81c784; }
        .msg.player { color: #64b5f6; }
        
        .controls {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            font-size: 1em;
        }
        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-send { background-color: #4caf50; color: white; }
        .btn-mic { background-color: #0288d1; color: white; }
        .btn-mic.listening { background-color: #d32f2f; }
    </style>
</head>
<body>

<div class="container">
    <div class="board-section">
        <h2>🧠 AI Coach Training Room</h2>
        <!-- Built-in fallback chessboard visual structure -->
        <div id="chessBoard" style="width: 100%; max-width: 500px; background: #404040; border-radius: 8px; border: 4px solid #333;"></div>
    </div>

    <div class="coach-section">
        <h3>💬 Assistant Coach & Evaluation</h3>
        <div class="engine-status">
            <span>Coach Mind: <strong id="engineState">Active</strong></span>
            <span id="posEval">Eval: +0.20</span>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="msg coach"><strong>Coach:</strong> Board loaded! Make a move on the board, or type your tactical thought below. I will grade your choice!</div>
        </div>
        <div class="controls">
            <input type="text" id="playerInput" placeholder="Type your idea or click Mic...">
            <button class="btn-mic" id="micBtn" onclick="toggleVoice()">🎙️</button>
            <button class="btn-send" onclick="sendPlayerIdea()">Explain</button>
        </div>
    </div>
</div>

<script src="https://jquery.com"></script>
<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>

<script>
    const game = new Chess();
    let board = null;
    let recognition = null;
    let isListening = false;

    // Use a solid public imagery source for pieces to prevent network dropping
    function imgPiece(piece) {
        return 'https://chessboardjs.com' + piece + '.png';
    }

    function initVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            document.getElementById('micBtn').style.display = 'none';
            return;
        }
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
        };
        recognition.onend = () => {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
        };
        recognition.onresult = (event) => {
            document.getElementById('playerInput').value = event.results[0][0].transcript;
            sendPlayerIdea();
        };
    }

    function toggleVoice() {
        if (!recognition) return;
        if (isListening) recognition.stop(); else recognition.start();
    }

    function onDragStart (source, piece, position, orientation) {
        if (game.game_over()) return false;
        if (piece.search(/^b/) !== -1) return false;
    }

    function onDrop (source, target) {
        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        setTimeout(() => {
            appendChat('coach', `You played ${move.san}. I like this idea—it fights for control of the board. Let's see how the defense responds.`);
            makeComputerMove();
        }, 500);
    }

    function makeComputerMove() {
        if (game.game_over()) return;
        const moves = game.moves();
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        game.move(randomMove);
        board.position(game.fen());
    }

    function sendPlayerIdea() {
        const inputEl = document.getElementById('playerInput');
        const ideaText = inputEl.value.trim();
        if (!ideaText) return;

        appendChat('player', ideaText);
        inputEl.value = '';

        setTimeout(() => {
            appendChat('coach', `Regarding your idea: "${ideaText}"—this is solid strategy. Keeping tactical piece coordinates active prevents threats from building up.`);
        }, 800);
    }

    function appendChat(sender, text) {
        const box = document.getElementById('chatBox');
        const label = sender === 'coach' ? 'Coach' : 'You';
        box.innerHTML += `<div class="msg ${sender}"><strong>${label}:</strong> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    window.onload = function() {
        board = Chessboard('chessBoard', {
            draggable: true,
            position: 'start',
            pieceTheme: imgPiece, // Explicitly point to secure piece layouts
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: () => board.position(game.fen())
        });
        initVoice();
    };
</script>
</body>
</html>
