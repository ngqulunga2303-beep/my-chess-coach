<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chess Coach</title>
<style>
body {
  background: #1a1a1a;
  color: #fff;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}
.grid-board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  width: 440px;
  height: 440px;
  box-sizing: border-box;
  border: 4px solid #333;
}
.square {
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  user-select: none;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}
.light { background: #f0d9b5; }
.dark { background: #b58863; }
.selected { background: #7a9a60 !important; }

.piece {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  font-size: 42px;
  line-height: 1;
}
.white-piece {
  color: #ffffff;
  text-shadow: 
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}
.black-piece {
  color: #111111;
  text-shadow: 
    -2px -2px 0 #fff,
     2px -2px 0 #fff,
    -2px  2px 0 #fff,
     2px  2px 0 #fff;
}

.coach-section {
  width: 350px;
  background: #262626;
  padding: 20px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
}
.chat-box {
  height: 330px;
  background: #121212;
  overflow-y: auto;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 4px;
}
.controls {
  display: flex;
  gap: 5px;
}
input {
  flex: 1;
  padding: 10px;
  background: #333;
  color: #fff;
  border: none;
}
button {
  padding: 10px;
  background: #4caf50;
  color: #fff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
  <div>
    <h2>🧠 AI Chess Coach</h2>
    <div id="board" class="grid-board"></div>
  </div>
  <div class="coach-section">
    <h3>💬 Assistant Coach</h3>
    <div id="chat" class="chat-box">
      <p style="color:#81c784">
        <strong>Coach:</strong> Board grid layout fixed! Squares are completely equal. Move white!
      </p>
    </div>
    <div class="controls">
      <input id="input" placeholder="Type strategy...">
      <button onclick="send()">Explain</button>
    </div>
  </div>
</div>

<script>
const initial = [
  ['♜','♞','♝','♛','♚','♝','♞','♜'],
  ['♟','♟','♟','♟','♟','♟','♟','♟'],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['','','','','','','',''],
  ['♙','♙','♙','♙','♙','♙','♙','♙'],
  ['♖','♘','♗','♕','♔','♗','♘','♖']
];

const colors = {
  '♜':'b','♞':'b','♝':'b','♛':'b','♚':'b','♟':'b',
  '♖':'w','♘':'w','♗':'w','♕':'w','♔':'w','♙':'w'
};

let grid = JSON.parse(JSON.stringify(initial));
let active = null;

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for(let r=0; r<8; r++) {
    for(let c=0; c<8; c++) {
      const sq = document.createElement('div');
      sq.className = `square ${(r+c)%2===0?'light':'dark'}`;
      if(active && active.r===r && active.c===c) {
        sq.classList.add('selected');
      }
      const sym = grid[r][c];
      if(sym) {
        const p = document.createElement('span');
        p.className = `piece ${colors[sym]==='w'?'white-piece':'black-piece'}`;
        p.innerText = sym;
        sq.appendChild(p);
      }
      sq.onclick = () => clickSquare(r,c);
      el.appendChild(sq);
    }
  }
}

function clickSquare(r,c) {
  const sym = grid[r][c];
  if(active) {
    if(active.r!==r || active.c!==c) {
      grid[r][c] = grid[active.r][active.c];
      grid[active.r][active.c] = '';
      active = null;
      render();
      setTimeout(reply, 600);
    } else {
      active = null;
      render();
    }
  } else {
    if(sym && colors[sym]==='w') {
      active = {r,c};
      render();
    }
  }
}

function reply() {
  addMsg('Coach', 'Good development. Let me move.', '#81c784');
  for(let r=1; r<7; r++) {
    for(let c=0; c<8; c++) {
      const sym = grid[r][c];
      if(sym && colors[sym]==='b' && grid[r+1][c]==='') {
        grid[r+1][c] = grid[r][c];
        grid[r][c] = '';
        render();
        return;
      }
    }
  }
}

function send() {
  const txt = document.getElementById('input').value.trim();
  if(!txt) return;
  addMsg('You', txt, '#64b5f6');
  document.getElementById('input').value = '';
  setTimeout(() => {
    addMsg('Coach', 'Logical strategic plan.', '#81c784');
  }, 600);
}

function addMsg(user, txt, col) {
  const box = document.getElementById('chat');
  box.innerHTML += `<p style="color:${col}"><strong>${user}:</strong> ${txt}</p>`;
  box.scrollTop = box.scrollHeight;
}

window.onload = render;
</script>
</body>
</html>
