<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Coach Training Room</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #161512;
            color: #bababa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
        }
        .board-section {
            flex: 1.2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .grid-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1;
            border: 4px solid #262421;
            border-radius: 3px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .square.light { background-color: #f0d9b5; }
        .square.dark { background-color: #b58863; }
        .square.selected { background-color: rgba(130, 151, 105, 0.7) !important; }
        
        .piece-img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            pointer-events: none;
        }

        .coach-section {
            flex: 1;
            min-width: 320px;
            background-color: #1e1e1c;
            border: 1px solid #2d2b28;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .engine-status {
            background-color: #262421;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-bottom: 15px;
            color: #bababa;
            display: flex;
            justify-content: space-between;
        }
        .chat-box {
            flex: 1;
            min-height: 280px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #2d2b28;
            border-radius: 6px;
            padding: 15px;
            background-color: #161512;
            margin-bottom: 15px;
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.coach { color: #bf8142; }
        .msg.player { color: #4fa3a5; }
        
        .controls {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #3d3a35;
            background-color: #262421;
            color: #fff;
            font-size: 1em;
        }
        button {
            padding: 12px 18px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-send { background-color: #e69138; color: white; }
        .btn-mic { background-color: #45818e; color: white; }
        .btn-mic.listening { background-color: #cc0000; }
    </style>
</head>
<body>

<div class="container">
    <div class="board-section">
        <h2>🧠 AI Coach Training Room</h2>
        <div id="htmlBoard" class="grid-board"></div>
        <p style="color: #666; margin-top: 12px; font-size: 0.9em;">Click your piece, then click the destination square to move.</p>
    </div>

    <div class="coach-section">
        <h3>💬 Assistant Coach</h3>
        <div class="engine-status">
            <span>Coach Mind: <strong>Active</strong></span>
            <span id="posEval">Eval: +0.15</span>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="msg coach"><strong>Coach:</strong> UI updated with official Lichess graphics! Propose an idea or try making a development move.</div>
        </div>
        <div class="controls">
            <input type="text" id="playerInput" placeholder="Type your idea or click Mic...">
            <button class="btn-mic" id="micBtn" onclick="toggleVoice()">🎙️</button>
            <button class="btn-send" onclick="sendPlayerIdea()">Explain</button>
        </div>
    </div>
</div>

<script>
    const initialBoard = [
        ['bR','bN','bB','bQ','bK','bB','bN','bR'],
        ['bP','bP','bP','bP','bP','bP','bP','bP'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['wP','wP','wP','wP','wP','wP','wP','wP'],
        ['wR','wN','wB','wQ','wK','wB','wN','wR']
    ];

    let currentBoard = JSON.parse(JSON.stringify(initialBoard));
    let selectedSquare = null;
    let recognition = null;
    let isListening = false;

    function getPieceImgUrl(code) {
        if (!code) return '';
        const color = code[0];
        const type = code[1];
        return `https://chessboardjs.com{color}${type}.png`;
    }

    function renderNativeBoard() {
        const boardEl = document.getElementById('htmlBoard');
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }
                
                const pieceCode = currentBoard[r][c];
                if (pieceCode) {
                    const img = document.createElement('img');
                    img.src = getPieceImgUrl(pieceCode);
                    img.className = 'piece-img';
                    square.appendChild(img);
                }
                
                square.onclick = () => handleSquareClick(r, c);
                boardEl.appendChild(square);
            }
        }
    }

    function handleSquareClick(r, c) {
        const piece = currentBoard[r][c];
        
        if (selectedSquare) {
            if (selectedSquare.r !== r || selectedSquare.c !== c) {
                currentBoard[r][c] = currentBoard[selectedSquare.r][selectedSquare.c];
                currentBoard[selectedSquare.r][selectedSquare.c] = '';
                selectedSquare = null;
                renderNativeBoard();
                
                setTimeout(() => {
                    appendChat('coach', "Interesting choice. That changes the tension in the center. Let's see how the defense repositions.");
                    simulateBlackResponse();
                }, 600);
            } else {
                selectedSquare = null;
                renderNativeBoard();
            }
        } else {
            if (piece && piece.startsWith('w')) {
                selectedSquare = { r, c };
                renderNativeBoard();
            }
        }
    }

    function simulateBlackResponse() {
        for (let r = 1; r < 7; r++) {
            for (let c = 0; c < 8; c++) {
                if (currentBoard[r][c] && currentBoard[r][c].startsWith('b')) {
                    if (currentBoard[r+1] && currentBoard[r+1][c] === '') {
                        currentBoard[r+1][c] = currentBoard[r][c];
                        currentBoard[r][c] = '';
                        renderNativeBoard();
                        return;
                    }
                }
            }
        }
    }

    function initVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            document.getElementById('micBtn').style.display = 'none';
            return;
        }
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('micBtn').classList.add('listening');
        };
        recognition.onend = () => {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
        };
        recognition.onresult = (event) => {
            document.getElementById('playerInput').value = event.results[0][0].transcript;
            sendPlayerIdea();
        };
    }

    function toggleVoice() {
        if (!recognition) return;
        if (isListening) recognition.stop(); else recognition.start();
    }

    function sendPlayerIdea() {
        const inputEl = document.getElementById('playerInput');
        const ideaText = inputEl.value.trim();
        if (!ideaText) return;

        appendChat('player', ideaText);
        inputEl.value = '';

        setTimeout(() => {
            appendChat('coach', `Analyzing strategic intent: "${ideaText}". Your plan is structurally logical. Controlling these central operational lanes will make your endgame much easier.`);
        }, 800);
    }

    function appendChat(sender, text) {
        const box = document.getElementById('chatBox');
        const label = sender === 'coach' ? 'Coach' : 'You';
        box.innerHTML += `<div class="msg ${sender}"><strong>${label}:</strong> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    window.onload = function() {
        renderNativeBoard();
        initVoice();
    };
</script>
</body>
</html>
